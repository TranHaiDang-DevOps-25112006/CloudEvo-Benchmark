version: "3.8"

services:
  web-app:
    build: ../../app
    container_name: cloudevo-web
    restart: always
    environment:
      - PORT=3000
      - STORAGE_MODE=memory
      - SCENARIO_NAME=Case 1 - Hosting 1 Web App on Single EC2 (Stateless)
    expose:
      - "3000"

  nginx:
    image: nginx:1.25-alpine
    container_name: cloudevo-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../../app/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app
